services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [queue_redis:/data]
    command: redis-server --appendonly yes
  api:
    build: .
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: portfolio-jobs
    ports: ["3001:3001"]
    depends_on: [redis]
  worker:
    build: .
    command: node dist/worker.js
    environment:
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: portfolio-jobs
    depends_on: [redis]
volumes:
  queue_redis: